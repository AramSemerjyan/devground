<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DartPad Lite - Editor</title>
    <style>
        html,
        body,
        #container {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #editor {
            height: calc(100% - 40px);
        }

        #toolbar {
            height: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px;
        }

        #output {
            height: 150px;
            overflow: auto;
            background: #1e1e1e;
            color: #dcdcdc;
            font-family: monospace;
            padding: 8px;
        }
    </style>
</head>

<body>
    <div id="editor"></div>
    <div id="output"></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.37.1/min/vs/loader.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.37.1/min/vs' } });
        window.editor = null;
        window.editorReady = false;
        window.pendingEditorMessages = [];

        const output = document.getElementById('output');
        const status = document.getElementById('status');

        function sendToFlutter(msg) {
            // This name ('EditorChannel') must match the JavascriptChannel created in Flutter
            try {
                EditorChannel.postMessage(JSON.stringify(msg));
            } catch (e) {
                console.error('postMessage failed', e);
            }
        }

        function applyMessageToEditor(msg) {
            if (msg.type === 'output') {
                output.textContent += msg.payload + '\n';
            } else if (msg.type === 'status') {
                if (status) {
                    status.textContent = msg.payload;
                }
            } else if (msg.type === 'replaceCode') {
                if (window.editor) {
                    window.editor.setValue(msg.payload);
                }
            } else if (msg.type === 'clearOutput') {
                output.textContent = '';
            } else if (msg.type === 'setDiagnostics') {
                output.textContent += 'DIAGNOSTICS:\\n' + JSON.stringify(msg.payload, null, 2) + '\\n';
            } else if (msg.type === 'setLanguage') {
                if (window.editor) {
                    monaco.editor.setModelLanguage(window.editor.getModel(), msg.payload);
                }
            }
        }

        // Messages FROM Flutter: Flutter will call `evaluateJavascript` that executes window.postMessageToEditor(...)
        window.postMessageToEditor = function (message) {
            try {
                const msg = typeof message === 'string' ? JSON.parse(message) : message;
                if (!window.editorReady && (msg.type === 'replaceCode' || msg.type === 'setLanguage')) {
                    window.pendingEditorMessages.push(msg);
                    return;
                }
                applyMessageToEditor(msg);
            } catch (e) {
                console.error(e);
            }
        };

        window.getEditorValue = function () {
            if (!window.editor) return '';
            return window.editor.getValue();
        };

        window.setEditorLanguage = function (language) {
            window.postMessageToEditor({ type: 'setLanguage', payload: language });
        };

        require(['vs/editor/editor.main'], function () {
            window.editor = monaco.editor.create(document.getElementById('editor'), {
                value: [
                    "void main() {",
                    "  print('Hello from Dart!');",
                    "}"
                ].join('\n'),
                language: 'dart',
                automaticLayout: true,
                theme: 'vs-dark',
                fontSize: 14,

                // Minimap
                minimap: {
                    enabled: false,
                },

                // Code Folding
                folding: true,
                showFoldingControls: 'mouseover',
                foldingStrategy: 'auto',
                foldingHighlight: true,
                unfoldOnClickAfterEndOfLine: false,
                bracketPairColorization: {
                    enabled: true,
                },
                guides: {
                    bracketPairs: true,
                    indentation: true,
                },
                matchBrackets: 'always',
                scrollBeyondLastLine: false,
                smoothScrolling: true,
                mouseWheelZoom: true,
                wordWrap: 'off',
                wordWrapColumn: 80,
                cursorBlinking: 'smooth',
                cursorSmoothCaretAnimation: 'on',
                multiCursorModifier: 'alt',
                quickSuggestions: true,
                suggestOnTriggerCharacters: true,
                acceptSuggestionOnEnter: 'on',
                tabCompletion: 'on',
                formatOnPaste: true,
                formatOnType: false,
                autoClosingBrackets: 'languageDefined',
                links: true,
                hover: {
                    enabled: true,
                    delay: 300,
                },
                find: {
                    seedSearchStringFromSelection: 'selection',
                    autoFindInSelection: 'never',
                },
                contextmenu: true,
                renderWhitespace: 'selection',
                renderLineHighlight: 'all',
                selectOnLineNumbers: true,
                lineNumbersMinChars: 3,
                glyphMargin: true,
                renderValidationDecorations: 'on',
            });

            window.editorReady = true;
            while (window.pendingEditorMessages.length > 0) {
                applyMessageToEditor(window.pendingEditorMessages.shift());
            }
            sendToFlutter({ type: 'editorReady' });

            // Listen for editor focus events - MUST be inside require callback
            window.editor.onDidFocusEditorText(function () {
                console.log('Editor focused');
                sendToFlutter({ type: 'editorFocused' });
            });

            // Listen for editor blur (lost focus) events
            window.editor.onDidBlurEditorText(function () {
                console.log('Editor blurred');
                sendToFlutter({ type: 'editorBlurred' });
            });
        });
    </script>
    <script src="https://unpkg.com/vscode-ws-jsonrpc/dist/browser.js"></script>
    <script src="https://unpkg.com/monaco-languageclient/lib/monaco-languageclient.js"></script>
</body>

</html>
